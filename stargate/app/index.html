<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guided phone setup</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="shell">
<header class="top">
<img class="logo" src="/logo.png" width="28" height="28" alt="">
<nav aria-label="Steps" class="steps">
<ol id="rail-list">
<li><button type="button" data-step="welcome"><span class="bar"></span><span class="name">Welcome</span></button></li>
<li><button type="button" data-step="connect"><span class="bar"></span><span class="name">Connect</span></button></li>
<li><button type="button" data-step="questions"><span class="bar"></span><span class="name">Questions</span></button></li>
<li><button type="button" data-step="phone"><span class="bar"></span><span class="name">Your phone</span></button></li>
<li><button type="button" data-step="services"><span class="bar"></span><span class="name">Services</span></button></li>
<li><button type="button" data-step="research"><span class="bar"></span><span class="name">Research</span></button></li>
<li><button type="button" data-step="build"><span class="bar"></span><span class="name">Build</span></button></li>
<li><button type="button" data-step="boot"><span class="bar"></span><span class="name">Install</span></button></li>
<li><button type="button" data-step="done"><span class="bar"></span><span class="name">Done</span></button></li>
</ol>
</nav>
</header>
<main id="screen" tabindex="-1"></main>
<noscript><p>This app needs JavaScript to run.</p></noscript>
<footer class="foot">
<button type="button" id="nav-back" class="ghost">Back</button>
<span id="status-line" role="status" aria-live="polite">Starting up.</span>
<button type="button" id="signout" class="quiet">Sign out</button>
<button type="button" id="nav-next" class="primary">Continue</button>
</footer>
</div>
<script src="/app.js"></script>
</body>
</html>
