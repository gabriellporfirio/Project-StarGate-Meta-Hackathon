[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "stargate"
version = "0.0.0"
description = "StarGate M0: workspace health check (stargate doctor)"
readme = "README.md"
requires-python = ">=3.12"
# No dependencies: standard library only.

[project.scripts]
stargate = "stargate.cli:main"

[tool.setuptools]
packages = ["stargate", "stargate.build"]

[tool.setuptools.package-data]
stargate = ["app/*"]
